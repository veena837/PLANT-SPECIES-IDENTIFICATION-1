<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plant Species Identification{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %} 
</head>
<body>
  <nav class="topbar">
    <a href="{{ url_for('index') }}" class="brand">🌿 Plant Species <small>Identification</small></a>
    <div>
      <a href="{{ url_for('about') }}" class="btn-about">About</a>
      <a href="{{ url_for('admin') }}" class="btn-about admin">Admin</a>
    </div>
  </nav>
  <main class="container py-4">
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="alert alert-warning text-center">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
